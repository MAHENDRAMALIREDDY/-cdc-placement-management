spring.application.name=backend

# File-based H2 — data is saved to disk and survives server restarts
spring.datasource.url=jdbc:h2:file:./data/cdpmsdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
# TODO: move to environment variable in production: DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:cdcp@2024}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT (use a long random string in production)
jwt.secret=${JWT_SECRET:cdcp-placement-secret-key-2024-minimum-256-bits-long}

# CORS allowed origins (comma-separated, override in production)
cors.allowed-origins=http://localhost:5173,http://localhost:5174

# File upload limits (5 MB max)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
